<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة الشجاع للتوصيل السريع</title>
    
    <!-- وصف محركات البحث وSEO لمنع تنبيهات Lighthouse -->
    <meta name="description" content="منصة الشجاع للتوصيل السريع - نظام ذكي لإدارة وتتبع الشحنات والمناديب وإدارة العمليات." />

    <!-- إعدادات الـ PWA وتثبيت التطبيق -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#facc15" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="منصة الشجاع" />

    <!-- تسجيل Service Worker مع Background Sync و Periodic Sync -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js');
            
            // 1. تسجيل Background Sync لمزامنة التحديثات عند عودة الاتصال
            if ('sync' in reg) {
              try {
                await reg.sync.register('sync-offline-updates');
              } catch (e) {}
            }

            // 2. تفعيل المزامنة الدورية للشحنات (Periodic Sync)
            if ('periodicSync' in reg) {
              try {
                const status = await navigator.permissions.query({
                  name: 'periodic-background-sync',
                });
                if (status.state === 'granted') {
                  await reg.periodicSync.register('sync-shipments', {
                    minInterval: 12 * 60 * 60 * 1000,
                  });
                }
              } catch (permErr) {
                try {
                  await reg.periodicSync.register('sync-shipments', {
                    minInterval: 12 * 60 * 60 * 1000,
                  });
                } catch (e) {}
              }
            }
          } catch (err) {
            console.error('فشل تسجيل Service Worker:', err);
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
